<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY HALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e1a;
    --panel: #141a2e;
    --panel-hover: #1c2440;
    --line: #2a3357;
    --cyan: #33fff0;
    --pink: #ff2e88;
    --text: #eef1fa;
    --muted: #6d7597;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 0%, rgba(51,255,240,0.07), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255,46,136,0.07), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 24px 80px;
  }

  .layout {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.6rem;
    line-height: 1.4;
    margin: 0;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(51,255,240,0.5);
  }

  p.subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 500;
  }

  ul.game-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  ul.game-list li {
    aspect-ratio: 1 / 1;
  }

  .game-button {
    width: 100%;
    height: 100%;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, color 0.15s ease;
  }

  .game-button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(51,255,240,0.12), rgba(255,46,136,0.12));
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .game-button:hover,
  .game-button:focus-visible {
    border-color: var(--cyan);
    color: var(--text);
    outline: none;
    transform: translateY(-2px);
  }

  .game-button:hover::before,
  .game-button:focus-visible::before {
    opacity: 1;
  }

  .game-button:focus-visible {
    box-shadow: 0 0 0 3px rgba(51,255,240,0.35);
  }

  .game-button.active {
    border-color: var(--pink);
    color: var(--text);
    box-shadow: 0 0 16px rgba(255,46,136,0.35);
  }

  .slot-icon {
    width: 30px;
    height: 30px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    position: relative;
    z-index: 1;
  }

  .slot-number {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    position: relative;
    z-index: 1;
  }

  .slot-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    position: relative;
    z-index: 1;
  }

  .player {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .player-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.7rem;
    color: var(--pink);
    letter-spacing: 0.05em;
  }

  .player-frame-wrap {
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    display: flex;
    box-shadow: 0 0 30px rgba(0,0,0,0.4) inset;
  }

  .player-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .placeholder {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 24px;
  }

  @media (max-width: 900px) {
    ul.game-list {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (max-width: 600px) {
    ul.game-list {
      grid-template-columns: repeat(3, 1fr);
    }
    h1 {
      font-size: 1.1rem;
    }
  }

  @media (max-width: 400px) {
    ul.game-list {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  :root {
    --bg: #0b0e1a;
    --panel: #141a2e;
    --bubble-me: #33fff0;
    --bubble-them: #1c2440;
    --line: #2a3357;
    --text: #eef1fa;
    --muted: #6d7597;
    --pink: #ff2e88;
  }

  * { box-sizing: border-box; }

  #aiGame html, body {
    height: 100%;
    margin: 0;
  }

  #aiGame body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    display: flex;
    flex-direction: column;
  }

  #aiGame header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #aiGame header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 8px var(--pink);
  }

  #aiGame header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.7rem;
    margin: 0;
    color: var(--pink);
  }

  #aiGame header .status {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #aiGame #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #aiGame .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  #aiGame .msg .sender {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    margin-bottom: 3px;
    opacity: 0.75;
  }

  #aiGame .msg.me {
    align-self: flex-end;
    background: var(--bubble-me);
    color: #04211f;
    border-bottom-right-radius: 4px;
  }

  #aiGame .msg.them {
    align-self: flex-start;
    background: var(--bubble-them);
    color: var(--text);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  #aiGame .msg.typing {
    color: var(--muted);
    font-style: italic;
  }

  #aiGame form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  #aiGame input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-family: 'Rubik', sans-serif;
    font-size: 0.95rem;
  }

  #aiGame input[type="text"]:focus {
    outline: none;
    border-color: var(--pink);
  }

  #aiGame button {
    background: var(--pink);
    color: #22030f;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
  }

  #aiGame button:hover {
    background: #ff5da3;
  }

  #aiGame button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #aiGame .setup-warning {
    margin: auto;
    max-width: 440px;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  #aiGame .setup-warning code {
    background: var(--panel);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--pink);
  }
</style>
</head>
<body>

  const controllerIcon = `
    <svg class="slot-icon" viewBox="0 0 24 24">
      <path d="M6 9h2M7 8v2M14 9h.01M17 11h.01" stroke-linecap="round"/>
      <path d="M7.5 6h9a4 4 0 0 1 3.98 4.4l-.6 5.6a2.4 2.4 0 0 1-4.2 1.4l-1.1-1.4H8.42l-1.1 1.4a2.4 2.4 0 0 1-4.2-1.4l-.6-5.6A4 4 0 0 1 6.5 6h1z" stroke-linejoin="round"/>
    </svg>
  `;

  for (let i = 1; i <= TOTAL_GAMES; i++) {
    const num = String(i).padStart(2, '0');
    const label = gameNames[i - 1] || 'Empty';
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'game-button';
    btn.dataset.src = gameLinks[i - 1] || `games/game-${num}.html`;
    btn.innerHTML = `
      ${controllerIcon}
      <span class="slot-number">${num}</span>
      <span class="slot-label">${label}</span>
    `;
    li.appendChild(btn);
    list.appendChild(li);
  }

  const buttons = document.querySelectorAll('.game-button');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      wrap.innerHTML = '';

      const slot = btn.querySelector('.slot-number').textContent;

      if (slot === '03') {
        const aiGame = document.createElement('div');
        aiGame.id = 'aiGame';
        aiGame.style.cssText = 'width:100%;height:100%;min-height:0;display:flex;flex-direction:column;';
        aiGame.innerHTML = `

<header>
  <span class="dot"></span>
  <h1>AI GABE</h1>
  <span class="status" id="statusLabel">idle</span>
</header>

<div id="log"></div>

<form id="chatForm">
  <input type="text" id="messageInput" placeholder="Say something to Gabe..." autocomplete="off" required>
  <button type="submit" id="sendBtn">Send</button>
</form>



`;

        wrap.appendChild(aiGame);

        const script = document.createElement('script');
        script.textContent = `
(function () {
  const OPENAI_API_KEY = "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"; // Intentionally empty: the key stays on the backend.
  const AI_ENDPOINT = "https://gabe-ai-backend.portalex987.workers.dev/api/chat";

  const SYSTEM_PROMPT =
    "You are Gabe, a friendly, funny, upbeat chat companion living on a " +
    "retro game hub website. Keep replies short and casual, like texting " +
    "a buddy. Never claim to be a real person.";

  const log = document.querySelector('#aiGame #log');
  const form = document.querySelector('#aiGame #chatForm');
  const input = document.querySelector('#aiGame #messageInput');
  const sendBtn = document.querySelector('#aiGame #sendBtn');
  const statusLabel = document.querySelector('#aiGame #statusLabel');

  let history = [{ role: 'system', content: SYSTEM_PROMPT }];

  function addMessage(text, sender, isTyping) {
    const div = document.createElement('div');
    div.className = 'msg ' + (sender === 'me' ? 'me' : 'them') + (isTyping ? ' typing' : '');
    const senderSpan = document.createElement('span');
    senderSpan.className = 'sender';
    senderSpan.textContent = sender === 'me' ? 'You' : 'Gabe';
    div.appendChild(senderSpan);
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  statusLabel.textContent = 'online';
  addMessage("Hey! I'm Gabe. What's up?", 'them');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    addMessage(text, 'me');
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('typing...', 'them', true);
    statusLabel.textContent = 'thinking...';

    try {
      const response = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();
      typingEl.remove();

      if (!response.ok || data.error) {
        addMessage('Error: ' + (data.error || 'The AI could not respond.'), 'them');
      } else {
        const reply = data.reply;
        addMessage(reply, 'them');
        history.push({ role: 'assistant', content: reply });
      }
    } catch (err) {
      typingEl.remove();
      addMessage('Something went wrong reaching Gabe. Check your AI backend connection.', 'them');
    }

    statusLabel.textContent = 'online';
    sendBtn.disabled = false;
    input.focus();
  });
})();
`;
