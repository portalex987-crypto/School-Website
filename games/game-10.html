<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07060d;
    --panel: #171226;
    --panel-hover: #211a38;
    --line: #3a2f5c;
    --cyan: #33fff0;
    --pink: #ff2e88;
    --gold: #ffcf4d;
    --text: #f3f1fb;
    --muted: #8b84ab;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #39ff6a;
    box-shadow: 0 0 8px #39ff6a;
    animation: dotPulse 1.6s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 6px #39ff6a; }
    50% { box-shadow: 0 0 14px #39ff6a; }
  }

  header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.75rem;
    margin: 0;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(51,255,240,0.6);
  }

  header .status {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .msg .sender {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    margin-bottom: 3px;
    opacity: 0.75;
  }

  .msg.me {
    align-self: flex-end;
    background: var(--cyan);
    color: #04211f;
    border-bottom-right-radius: 4px;
  }

  .msg.them {
    align-self: flex-start;
    background: var(--panel-hover);
    color: var(--text);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .msg.system {
    align-self: center;
    background: none;
    color: var(--muted);
    font-size: 0.78rem;
    font-style: italic;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-family: 'Rubik', sans-serif;
    font-size: 0.95rem;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--cyan);
  }

  button {
    background: var(--cyan);
    color: #04211f;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
  }

  button:hover {
    background: #5dfff5;
  }

  .setup-warning {
    margin: auto;
    max-width: 420px;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .setup-warning code {
    background: var(--panel);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--cyan);
  }
</style>
</head>
<body>

<header>
  <span class="dot"></span>
  <h1>CHAT</h1>
  <span class="status" id="statusLabel">connecting...</span>
</header>

<div id="log"></div>

<form id="chatForm">
  <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ======================================================
  // PASTE YOUR OWN SUPABASE PROJECT URL AND ANON KEY BELOW.
  // Get these from Project Settings > API in your Supabase
  // dashboard. The anon key is safe to expose publicly --
  // it's designed for use in client-side code like this.
  // ======================================================
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  // A fixed "room" so this reuses the same messages table as
  // the tic-tac-toe game, without needing separate chat rooms.
  const ROOM_CODE = "lobby";

  const log = document.getElementById('log');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('messageInput');
  const statusLabel = document.getElementById('statusLabel');

  const isConfigured = SUPABASE_URL !== "YOUR_SUPABASE_URL";

  function addMessage(text, kind, name) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    if (name) {
      const senderSpan = document.createElement('span');
      senderSpan.className = 'sender';
      senderSpan.textContent = name;
      div.appendChild(senderSpan);
    }
    div.appendChild(document.createTextNode(text));
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  if (!isConfigured) {
    statusLabel.textContent = 'not set up';
    log.innerHTML = `
      <div class="setup-warning">
        This chat isn't connected yet.<br><br>
        Open <code>game-10.html</code> and replace
        <code>YOUR_SUPABASE_URL</code> and
        <code>YOUR_SUPABASE_ANON_KEY</code> with your own values
        from the Supabase dashboard, then reload this page.
      </div>
    `;
    form.style.display = 'none';
  } else {
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let myName = null;
    while (!myName) {
      myName = prompt('Enter a display name to join the chat:');
    }

    statusLabel.textContent = 'connected as ' + myName;
    addMessage('joined the chat', 'system', myName);

    async function loadHistory() {
      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .eq('room_code', ROOM_CODE)
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) {
        addMessage('Could not load chat history: ' + error.message, 'system');
        return;
      }

      (data || []).forEach(m => {
        addMessage(m.text, m.name === myName ? 'me' : 'them', m.name);
      });
    }

    function listenForMessages() {
      supabase
        .channel('chat-' + ROOM_CODE)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: 'room_code=eq.' + ROOM_CODE
        }, (payload) => {
          const m = payload.new;
          // Skip re-adding our own message a second time --
          // it's already shown immediately on send below.
          if (m.name === myName) return;
          addMessage(m.text, 'them', m.name);
        })
        .subscribe();
    }

    // Basic word filter -- add or remove words as you like.
    // Matches whole words only (case-insensitive), so "class"
    // won't get flagged just because it contains "ass".
    const BANNED_WORDS = ["fuck", "shit", "bitch", "asshole", "bastard", "dick", "whore", "slut"];

    function containsBannedWord(text) {
      const lower = text.toLowerCase();
      return BANNED_WORDS.some(word => {
        const pattern = new RegExp('\\b' + word + '\\b', 'i');
        return pattern.test(lower);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      if (containsBannedWord(text)) {
        addMessage('Your message wasn\'t sent -- it contains language that isn\'t allowed here.', 'system');
        input.value = '';
        return;
      }

      addMessage(text, 'me', myName);
      input.value = '';

      const { error } = await supabase.from('messages').insert({
        room_code: ROOM_CODE,
        name: myName,
        text: text
      });

      if (error) {
        addMessage('Message failed to send: ' + error.message, 'system');
      }
    });

    loadHistory().then(listenForMessages);
  }
</script>

</body>
</html>
