<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY HALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07060d;
    --panel: #171226;
    --panel-hover: #211a38;
    --line: #3a2f5c;
    --cyan: #33fff0;
    --pink: #ff2e88;
    --gold: #ffcf4d;
    --text: #f3f1fb;
    --muted: #8b84ab;
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    margin: 0;
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(51,255,240,0.10), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,46,136,0.10), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, #0d0a1a 60%, #150e26 100%);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    display: flex;
    justify-content: center;
    padding: 110px 24px 90px;
    overflow-x: hidden;
  }

  /* retro floor grid glowing at the bottom of the page */
  body::before {
    content: '';
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 45vh;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(51,255,240,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(51,255,240,0.16) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(400px) rotateX(60deg);
    transform-origin: bottom;
    mask-image: linear-gradient(to top, black, transparent);
    -webkit-mask-image: linear-gradient(to top, black, transparent);
    opacity: 0.5;
    z-index: 0;
  }

  /* scanline overlay for a CRT feel */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.10) 3px
    );
    z-index: 1;
    mix-blend-mode: overlay;
  }

  .layout {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    position: relative;
    z-index: 2;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    padding: 22px 20px 26px;
    background: linear-gradient(180deg, var(--panel) 0%, rgba(23,18,38,0.4) 100%);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow:
      0 0 0 3px rgba(51,255,240,0.08),
      0 0 30px rgba(51,255,240,0.12),
      inset 0 0 40px rgba(255,46,136,0.06);
    position: relative;
  }

  header::before,
  header::after {
    content: '';
    position: absolute;
    top: 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  header::before { left: 14px; }
  header::after { right: 14px; }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.9rem;
    line-height: 1.5;
    margin: 0;
    color: var(--cyan);
    letter-spacing: 0.04em;
    text-shadow:
      0 0 8px rgba(51,255,240,0.8),
      0 0 22px rgba(51,255,240,0.5),
      0 0 2px #fff;
    animation: flicker 4s infinite;
  }

  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.82; }
    98% { opacity: 1; }
    99% { opacity: 0.88; }
  }

  p.subtitle {
    margin: 0;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    animation: blink 1.4s steps(1) infinite;
  }

  @keyframes blink {
    0%, 60% { opacity: 1; }
    61%, 100% { opacity: 0.25; }
  }

  ul.game-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
  }

  ul.game-list li {
    aspect-ratio: 1 / 1;
  }

  .game-button {
    width: 100%;
    height: 100%;
    background:
      linear-gradient(155deg, var(--panel-hover) 0%, var(--panel) 60%);
    border: 2px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 4px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .game-button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(51,255,240,0.18), rgba(255,46,136,0.18));
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .game-button:hover,
  .game-button:focus-visible {
    border-color: var(--cyan);
    color: var(--text);
    outline: none;
    transform: translateY(-3px);
    box-shadow:
      0 6px 0 rgba(0,0,0,0.45),
      0 0 18px rgba(51,255,240,0.45),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .game-button:hover::before,
  .game-button:focus-visible::before {
    opacity: 1;
  }

  .game-button:active {
    transform: translateY(0px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .game-button:focus-visible {
    box-shadow: 0 0 0 3px rgba(51,255,240,0.35);
  }

  .game-button.active {
    border-color: #39ff6a;
    color: var(--text);
    box-shadow:
      0 6px 0 rgba(0,0,0,0.45),
      0 0 20px rgba(57,255,106,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: activePulse 1.6s ease-in-out infinite;
  }

  @keyframes activePulse {
    0%, 100% {
      box-shadow:
        0 6px 0 rgba(0,0,0,0.45),
        0 0 16px rgba(57,255,106,0.5),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }
    50% {
      box-shadow:
        0 6px 0 rgba(0,0,0,0.45),
        0 0 30px rgba(57,255,106,0.85),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }
  }

  .slot-icon {
    width: 28px;
    height: 28px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 0 4px currentColor);
  }

  .slot-number {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.05em;
    position: relative;
    z-index: 1;
    color: var(--gold);
  }

  .slot-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 6px;
  }

  .player {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .player-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.72rem;
    color: var(--pink);
    letter-spacing: 0.06em;
    text-shadow: 0 0 8px rgba(255,46,136,0.6);
  }

  /* arcade-cabinet screen bezel */
  .player-frame-wrap {
    border: 10px solid #1a1526;
    border-radius: 20px;
    background: var(--panel);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    display: flex;
    box-shadow:
      0 0 0 2px var(--line),
      0 0 40px rgba(51,255,240,0.15),
      inset 0 0 40px rgba(0,0,0,0.6);
    position: relative;
  }

  .player-frame-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
    border-radius: 10px;
    z-index: 5;
  }

  .player-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    position: relative;
    z-index: 1;
  }

  .placeholder {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  /* ============== SETTINGS BUTTON + PANEL ============== */

  #settingsBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: linear-gradient(155deg, var(--panel-hover) 0%, var(--panel) 60%);
    border: 2px solid var(--line);
    border-radius: 10px;
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.45),
      0 0 12px rgba(255,207,77,0.25),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }

  #settingsBtn:hover,
  #settingsBtn:focus-visible {
    border-color: var(--cyan);
    outline: none;
    transform: translateY(-2px);
    box-shadow:
      0 5px 0 rgba(0,0,0,0.45),
      0 0 14px rgba(51,255,240,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  #settingsBtn:active {
    transform: translateY(0);
    box-shadow: 0 1px 0 rgba(0,0,0,0.45);
  }

  #settingsBtn .gear-icon {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }

  #settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(5,4,10,0.75);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #settingsOverlay.open {
    display: flex;
  }

  #settingsPanel {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, var(--panel) 0%, #100c1c 100%);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow:
      0 0 0 3px rgba(51,255,240,0.10),
      0 0 40px rgba(51,255,240,0.15),
      inset 0 0 30px rgba(255,46,136,0.05);
    padding: 26px 22px 26px;
    position: relative;
  }

  #settingsPanel::before,
  #settingsPanel::after {
    content: '';
    position: absolute;
    top: 12px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  #settingsPanel::before { left: 16px; }
  #settingsPanel::after { right: 16px; }

  #settingsPanel h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.85rem;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(51,255,240,0.6);
    margin: 0 0 20px;
    text-align: center;
    letter-spacing: 0.03em;
  }

  #settingsPanel .field {
    margin-bottom: 20px;
  }

  #settingsPanel label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  #settingsPanel input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-family: 'Rubik', sans-serif;
    font-size: 0.9rem;
  }

  #settingsPanel input[type="text"]:focus {
    outline: none;
    border-color: var(--cyan);
  }

  .swatch-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .swatch {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 3px solid var(--line);
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }

  .swatch:hover {
    transform: scale(1.12) rotate(-2deg);
  }

  .swatch.selected {
    border-color: #fff;
    box-shadow: 0 0 12px currentColor, 0 0 2px #fff inset;
    transform: scale(1.08);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toggle-switch {
    position: relative;
    width: 46px;
    height: 24px;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .toggle-switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--muted);
    transition: left 0.15s ease, background 0.15s ease;
  }

  .toggle-switch.on {
    border-color: var(--cyan);
  }

  .toggle-switch.on .knob {
    left: 24px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }

  #settingsPanel .panel-buttons {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  #settingsPanel .panel-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 2px solid var(--line);
    font-family: 'Press Start 2P', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  #settingsPanel .panel-buttons button:active {
    transform: translateY(1px);
  }

  #saveSettingsBtn {
    background: var(--cyan);
    color: #04211f;
    border-color: var(--cyan) !important;
  }

  #saveSettingsBtn:hover {
    box-shadow: 0 0 14px rgba(51,255,240,0.5);
  }

  #closeSettingsBtn {
    background: var(--panel-hover);
    color: var(--text);
  }

  #closeSettingsBtn:hover {
    border-color: var(--pink) !important;
  }

  body.no-scanlines::after {
    display: none;
  }

  /* ============== REQUIRED LOGIN GATE ============== */

  body.gated .layout,
  body.gated #settingsBtn {
    display: none;
  }

  #authGate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 15% 0%, rgba(51,255,240,0.10), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,46,136,0.10), transparent 45%),
      var(--bg);
  }

  body.gated #authGate {
    display: flex;
  }

  #authGatePanel {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(180deg, var(--panel) 0%, #100c1c 100%);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow:
      0 0 0 3px rgba(51,255,240,0.10),
      0 0 40px rgba(51,255,240,0.15);
    padding: 28px 24px;
    text-align: center;
  }

  #authGatePanel h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.1rem;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(51,255,240,0.6);
    margin: 0 0 8px;
  }

  #authGatePanel p {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }

  #authGatePanel input {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 12px;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }

  #authGatePanel input:focus {
    outline: none;
    border-color: var(--cyan);
  }

  #authGatePanel .gate-buttons {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  #authGatePanel .gate-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 2px solid var(--line);
    font-weight: 700;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
  }

  #gateLoginBtn {
    background: var(--cyan);
    color: #04211f;
  }

  #gateSignupBtn {
    background: var(--panel-hover);
    color: var(--text);
  }

  #authGateMessage {
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--pink);
    min-height: 1em;
  }

  @media (max-width: 900px) {
    ul.game-list {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (max-width: 600px) {
    ul.game-list {
      grid-template-columns: repeat(3, 1fr);
    }
    h1 {
      font-size: 1.2rem;
    }
  }

  @media (max-width: 400px) {
    ul.game-list {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  :root {
    --bg: #0b0e1a;
    --panel: #141a2e;
    --bubble-me: #33fff0;
    --bubble-them: #1c2440;
    --line: #2a3357;
    --text: #eef1fa;
    --muted: #6d7597;
    --pink: #ff2e88;
  }

  * { box-sizing: border-box; }

  #aiGame html, body {
    height: 100%;
    margin: 0;
  }

  #aiGame body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', sans-serif;
    display: flex;
    flex-direction: column;
  }

  #aiGame header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #aiGame header .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #39ff6a;
    box-shadow: 0 0 8px #39ff6a;
    animation: dotPulse 1.6s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 6px #39ff6a; }
    50% { box-shadow: 0 0 14px #39ff6a; }
  }

  #aiGame header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.7rem;
    margin: 0;
    color: var(--pink);
  }

  #aiGame header .status {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #aiGame #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #aiGame .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  #aiGame .msg .sender {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    margin-bottom: 3px;
    opacity: 0.75;
  }

  #aiGame .msg.me {
    align-self: flex-end;
    background: var(--bubble-me);
    color: #04211f;
    border-bottom-right-radius: 4px;
  }

  #aiGame .msg.them {
    align-self: flex-start;
    background: var(--bubble-them);
    color: var(--text);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  #aiGame .msg.typing {
    color: var(--muted);
    font-style: italic;
  }

  #aiGame form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  #aiGame input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-family: 'Rubik', sans-serif;
    font-size: 0.95rem;
  }

  #aiGame input[type="text"]:focus {
    outline: none;
    border-color: var(--pink);
  }

  #aiGame button {
    background: var(--pink);
    color: #22030f;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
  }

  #aiGame button:hover {
    background: #ff5da3;
  }

  #aiGame button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #aiGame .setup-warning {
    margin: auto;
    max-width: 440px;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  #aiGame .setup-warning code {
    background: var(--panel);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--pink);
  }
</style>
</head>
<body class="gated">

<div id="authGate">
  <div id="authGatePanel">
    <h1>ARCADE GAMES</h1>
    <p>Sign in or create an account to play.</p>
    <input type="text" id="gateEmail" placeholder="Email">
    <input type="password" id="gatePassword" placeholder="Password">
    <div class="gate-buttons">
      <button type="button" id="gateLoginBtn">Log In</button>
      <button type="button" id="gateSignupBtn">Sign Up</button>
    </div>
    <div id="authGateMessage"></div>
  </div>
</div>


<button id="settingsBtn" type="button">

<script>
  // ============== SETTINGS PANEL + ACCOUNTS ==============
  // PASTE YOUR OWN SUPABASE PROJECT URL AND ANON KEY BELOW --
  // same values used in game-10.html.
  const SUPABASE_URL = "https://oyzhwiufptwdtthjlagd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_QzadsJMfQQOVdm4Jr6b02Q_bxpJwykn";
  const authIsConfigured = SUPABASE_URL !== "YOUR_SUPABASE_URL";
  const supabaseClient = authIsConfigured
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  let currentUser = null;

  // Guest defaults, used until (or unless) someone logs in.
  // Guest progress lives in memory only and resets on reload.
  window.arcadeSettings = {
    displayName: 'You',
    accent: '#33fff0',
    scanlines: true,
    credits: 20
  };

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const playerNameInput = document.getElementById('playerNameInput');
  const swatchRow = document.getElementById('swatchRow');
  const scanlineToggle = document.getElementById('scanlineToggle');
  const loggedOutView = document.getElementById('loggedOutView');
  const loggedInView = document.getElementById('loggedInView');
  const loggedInEmail = document.getElementById('loggedInEmail');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authMessage = document.getElementById('authMessage');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  function applySettingsToUI() {
    swatchRow.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('selected', s.dataset.color === window.arcadeSettings.accent);
    });
    document.documentElement.style.setProperty('--cyan', window.arcadeSettings.accent);
    scanlineToggle.classList.toggle('on', window.arcadeSettings.scanlines);
    document.body.classList.toggle('no-scanlines', !window.arcadeSettings.scanlines);
    updateCreditsDisplay();
  }

  async function loadProfile(user) {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .maybeSingle();

    if (error) {
      authMessage.textContent = 'Could not load your profile: ' + error.message;
      return;
    }

    if (!data) {
      // First time this user has logged in -- create their profile row.
      const defaults = {
        id: user.id,
        display_name: 'You',
        accent: '#33fff0',
        scanlines: true,
        credits: 20
      };
      await supabaseClient.from('profiles').insert(defaults);
      window.arcadeSettings = {
        displayName: defaults.display_name,
        accent: defaults.accent,
        scanlines: defaults.scanlines,
        credits: defaults.credits
      };
    } else {
      window.arcadeSettings = {
        displayName: data.display_name,
        accent: data.accent,
        scanlines: data.scanlines,
        credits: data.credits
      };
    }

    applySettingsToUI();
  }

  async function saveProfile(patch) {
    if (!currentUser || !authIsConfigured) return;
    await supabaseClient.from('profiles').update(patch).eq('id', currentUser.id);
  }

  // Exposed so the game-click handler (below, in the other script)
  // can persist a credit spend when someone is logged in.
  window.persistCredits = function (newCredits) {
    if (currentUser) saveProfile({ credits: newCredits });
  };

  function showLoggedIn(user) {
    currentUser = user;
    loggedOutView.style.display = 'none';
    loggedInView.style.display = 'block';
    loggedInEmail.textContent = user.email;
    document.body.classList.remove('gated');
  }

  function showLoggedOut() {
    currentUser = null;
    loggedOutView.style.display = 'block';
    loggedInView.style.display = 'none';
    window.arcadeSettings = {
      displayName: 'You',
      accent: '#33fff0',
      scanlines: true,
      credits: 20
    };
    applySettingsToUI();
    document.body.classList.add('gated');
  }

  if (authIsConfigured) {
    signupBtn.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || !password) {
        authMessage.textContent = 'Enter an email and password.';
        return;
      }
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        authMessage.textContent = error.message;
      } else if (data.user && !data.session) {
        authMessage.textContent = 'Check your email to confirm your account, then log in.';
      } else if (data.session) {
        await loadProfile(data.user);
        showLoggedIn(data.user);
      }
    });

    loginBtn.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || !password) {
        authMessage.textContent = 'Enter an email and password.';
        return;
      }
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        authMessage.textContent = error.message;
      } else {
        await loadProfile(data.user);
        showLoggedIn(data.user);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      showLoggedOut();
    });

    // If someone's already logged in from a previous visit, restore them.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        loadProfile(data.session.user).then(() => showLoggedIn(data.session.user));
      }
    });

    // ---- Login gate (blocks the whole site until signed in) ----
    const gateEmail = document.getElementById('gateEmail');
    const gatePassword = document.getElementById('gatePassword');
    const gateMessage = document.getElementById('authGateMessage');
    const gateLoginBtn = document.getElementById('gateLoginBtn');
    const gateSignupBtn = document.getElementById('gateSignupBtn');

    gateLoginBtn.addEventListener('click', async () => {
      const email = gateEmail.value.trim();
      const password = gatePassword.value;
      if (!email || !password) {
        gateMessage.textContent = 'Enter an email and password.';
        return;
      }
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        gateMessage.textContent = error.message;
      } else {
        gateMessage.textContent = '';
        await loadProfile(data.user);
        showLoggedIn(data.user);
      }
    });

    gateSignupBtn.addEventListener('click', async () => {
      const email = gateEmail.value.trim();
      const password = gatePassword.value;
      if (!email || !password) {
        gateMessage.textContent = 'Enter an email and password.';
        return;
      }
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        gateMessage.textContent = error.message;
      } else if (data.user && !data.session) {
        gateMessage.textContent = 'Check your email to confirm your account, then log in.';
      } else if (data.session) {
        gateMessage.textContent = '';
        await loadProfile(data.user);
        showLoggedIn(data.user);
      }
    });
  } else {
    document.getElementById('accountSection').innerHTML =
      '<label>Account</label><div style="font-size:0.8rem; color:var(--muted);">Accounts aren\'t set up yet.</div>';
    // Accounts aren't configured yet -- don't lock people out of the site.
    document.body.classList.remove('gated');
  }

  function openSettings() {
    playerNameInput.value = window.arcadeSettings.displayName;
    updateCreditsDisplay();
    settingsOverlay.classList.add('open');
  }

  function updateCreditsDisplay() {
    const el = document.getElementById('creditsDisplay');
    if (el) el.textContent = window.arcadeSettings.credits;
  }

  function closeSettings() {
    settingsOverlay.classList.remove('open');
  }

  settingsBtn.addEventListener('click', openSettings);
  closeSettingsBtn.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  swatchRow.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      swatchRow.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      const color = sw.dataset.color;
      window.arcadeSettings.accent = color;
      document.documentElement.style.setProperty('--cyan', color);
      saveProfile({ accent: color });
    });
  });

  scanlineToggle.addEventListener('click', () => {
    const isOn = scanlineToggle.classList.toggle('on');
    window.arcadeSettings.scanlines = isOn;
    document.body.classList.toggle('no-scanlines', !isOn);
    saveProfile({ scanlines: isOn });
  });

  saveSettingsBtn.addEventListener('click', () => {
    const name = playerNameInput.value.trim() || 'You';
    window.arcadeSettings.displayName = name;
    saveProfile({ display_name: name });
    closeSettings();
  });
</script>

  statusLabel.textContent = 'online';
  addMessage("Hey! I'm Gabe. What's up?", 'them');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    addMessage(text, 'me');
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('typing...', 'them', true);
    statusLabel.textContent = 'thinking...';

    try {
      const response = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();
      typingEl.remove();

      if (!response.ok || data.error) {
        addMessage('Error: ' + (data.error || 'The AI could not respond.'), 'them');
      } else {
        const reply = data.reply;
        addMessage(reply, 'them');
        history.push({ role: 'assistant', content: reply });
      }
    } catch (err) {
      typingEl.remove();
      addMessage('Something went wrong reaching Gabe. Check your AI backend connection.', 'them');
    }

    statusLabel.textContent = 'online';
    sendBtn.disabled = false;
    input.focus();
  });
